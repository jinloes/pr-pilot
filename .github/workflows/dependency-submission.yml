name: Dependency submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Publishes main's resolved Gradle dependency graph so Dependabot alerts and dependency review can
# see Gradle dependencies; GitHub cannot read them from build.gradle alone.
jobs:
  gradle:
    name: Submit Gradle dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # submit the dependency snapshot to the dependency graph
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit
