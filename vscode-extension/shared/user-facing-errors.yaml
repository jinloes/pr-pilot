templates:
  github_auth_failed: "GitHub authentication failed. Run '{auth_command}', then retry."
  github_not_found_or_inaccessible: "GitHub returned 404 for this pull request. It may not exist, or the active gh account may not have access. Verify the PR URL; if it exists, run 'gh auth status' and switch accounts if needed."
  github_diff_too_large: "Pull request diff is too large. GitHub will not return this pull request's diff because it exceeds GitHub's size limits. Review smaller pull requests or split this one."
  provider_binary_missing: "'{binary}' is not available on PATH. Install {provider_cli} and retry."
  provider_not_installed: "Can't generate a review: the {provider_cli} ('{binary}') isn't installed or isn't on this app's PATH. Install it, confirm '{binary}' runs in your terminal, then try again."
  request_timed_out: "The request timed out while trying to {operation}. Retry, or try a smaller diff / lower reasoning effort."
  git_timed_out: "'git {command}' timed out while trying to {operation}. Check your VPN and your git access to the repository (SSH key or credentials), then retry."
  provider_start_timed_out: "GitHub Copilot did not start in time while trying to {operation}. Retry. If it keeps happening, check that 'copilot' runs in your terminal and that the MCP servers in your Copilot config start quickly."
  step_timed_out: "The '{step}' request timed out while trying to {operation}. Check your connection to GitHub, then retry."
  invalid_review_format: "The model returned an invalid review format. Retry, or switch to a more reliable model."
  network_error: "Network error while trying to {operation}. Check connectivity/VPN and retry."
  tls_certificate_untrusted: "Couldn't {operation}: Java could not verify GitHub's TLS certificate. The truststore of the Java runtime PR Pilot uses (lib/security/cacerts) is likely missing public root CAs. Update or reinstall that JDK, then retry."
  generic_failure: "Couldn't {operation}. Please retry."
