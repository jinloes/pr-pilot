// Dependency submission reports build classpaths too. Spring Boot's Gradle plugin pulls vulnerable
// httpclient5, httpcore5, Commons Lang and Jackson releases (for bootBuildImage), so floor them at
// patched versions. A constraint only raises a library a plugin already uses; it adds none.
buildscript {
    dependencies {
        constraints {
            classpath 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
            classpath 'org.apache.commons:commons-lang3:3.18.0'
            classpath 'org.apache.httpcomponents.client5:httpclient5:5.6.3'
            classpath 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
            classpath 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
        }
    }
}

plugins {
    id 'idea'
    id 'com.diffplug.spotless' version '8.8.0' apply false
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'info.solidsoft.pitest' version '1.19.0' apply false
}

idea {
    module {
        // Exclude generated/cache directories that IntelliJ should not index.
        excludeDirs += [
            file('.gradle'),
            file('.claude'),
            file('build'),
        ]
    }
}

// macOS JDKs before 25 do not supply SecureDirectoryStream, so source-inventory tests would only
// exercise their fail-closed UNSUPPORTED_API path. Run tests on an installed JDK 25 when there is
// one; otherwise those tests skip themselves (see SecureTraversal in review-engine tests).
// -PtestOnJdk25=false keeps the Gradle JVM, e.g. to check the skip path.
def secureTraversalJdk = providers.provider {
    if (providers.gradleProperty('testOnJdk25').getOrElse('true') == 'false'
            || !System.getProperty('os.name').toLowerCase().contains('mac')) {
        return false
    }
    def probe = ['/usr/libexec/java_home', '-F', '-v', '25'].execute()
    probe.waitFor()
    probe.exitValue() == 0
}

// JaCoCo is opt-in (-Pcoverage) so ordinary local runs stay fast. CI enables it and feeds
// jacocoAggregateReport's XML to diff-cover. Code exercised only inside child JVMs (the
// review-engine source-inventory and semantic workers) is not measured.
def coverageEnabled = providers.gradleProperty('coverage').isPresent()
def jacocoVersion = '0.8.15'

subprojects {
    // Mutation testing runs nightly (.github/workflows/mutation.yml) and is report-only.
    plugins.withId('info.solidsoft.pitest') {
        pitest {
            pitestVersion = '1.30.1'
            junit5PluginVersion = '1.2.3'
            targetClasses = ['com.jinloes.prpilot.*']
            threads = 4
            outputFormats = ['XML', 'HTML']
            timestampedReports = false
        }
    }

    plugins.withId('java') {
        // targetCompatibility alone only sets the bytecode version: on the JDK 21 build, a call to
        // a newer API (List.getFirst() for a Java 17 target) compiles, then fails at runtime.
        def declaredRelease = providers.provider {
            java.targetCompatibility.majorVersion.toInteger()
        }
        tasks.withType(JavaCompile).configureEach {
            options.release.set(declaredRelease)
            // Test sources too: JDK 17 on Windows reads unspecified sources in the code page.
            options.encoding = 'UTF-8'
        }

        if (coverageEnabled) {
            apply plugin: 'jacoco'
            jacoco {
                toolVersion = jacocoVersion
            }
            tasks.withType(Test).configureEach {
                jacoco {
                    includes = ['com.jinloes.prpilot.*']
                }
            }
        }

        if (secureTraversalJdk.get()) {
            tasks.withType(Test).configureEach {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(25)
                }
            }
        }
    }

    apply plugin: 'idea'
    idea {
        module {
            excludeDirs += [file('build')]
        }
    }

    apply plugin: 'com.diffplug.spotless'

    plugins.withId('java') {
        spotless {
            java {
                // Pinned below 1.35.0: 1.28.0+ references javac-internal classes (e.g.
                // com.sun.tools.javac.tree.JCTree$JCAnyPattern) that are unresolvable via
                // --add-exports on any locally available JDK — verified identical failure on
                // 17/21/25, so this is a broken artifact, not a JDK-version incompatibility.
                // 1.22.0 is the newest release confirmed to run cleanly with no extra JVM args.
                googleJavaFormat('1.22.0').aosp()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }
}

if (coverageEnabled) {
    repositories {
        mavenCentral()
    }
    apply plugin: 'jacoco'
    jacoco {
        toolVersion = jacocoVersion
    }

    def aggregateReport = tasks.register('jacocoAggregateReport', JacocoReport) {
        group = 'verification'
        description = 'Merges every Java module test run into one JaCoCo report.'
        reports {
            xml.required = true
            html.required = true
            csv.required = false
            xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregate/jacoco.xml')
            html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregate/html')
        }
    }

    // Subprojects apply their plugins after this script runs; wire them in once all are evaluated.
    gradle.projectsEvaluated {
        def javaProjects = subprojects.findAll { it.plugins.hasPlugin('java') }
        aggregateReport.configure { report ->
            javaProjects.each { p ->
                p.tasks.withType(Test).each { testTask ->
                    report.mustRunAfter(testTask)
                    // Disabled or skipped test tasks leave no .exec file behind.
                    def execFile = testTask.extensions.getByType(JacocoTaskExtension)
                            .destinationFile
                    report.executionData.from(files(execFile).filter { it.exists() })
                }
                report.sourceDirectories.from(p.sourceSets.main.allJava.srcDirs)
                report.classDirectories.from(p.sourceSets.main.output.classesDirs)
            }
        }
    }
}