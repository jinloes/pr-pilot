plugins {
    id 'idea'
    id 'com.diffplug.spotless' version '8.8.0' apply false
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

idea {
    module {
        // Exclude generated/cache directories that IntelliJ should not index.
        excludeDirs += [
            file('.gradle'),
            file('.claude'),
            file('build'),
        ]
    }
}

// macOS JDKs before 25 do not supply SecureDirectoryStream, so source-inventory tests would only
// exercise their fail-closed UNSUPPORTED_API path. Run tests on an installed JDK 25 when there is
// one; otherwise those tests skip themselves (see SecureTraversal in review-engine tests).
// -PtestOnJdk25=false keeps the Gradle JVM, e.g. to check the skip path.
def secureTraversalJdk = providers.provider {
    if (providers.gradleProperty('testOnJdk25').getOrElse('true') == 'false'
            || !System.getProperty('os.name').toLowerCase().contains('mac')) {
        return false
    }
    def probe = ['/usr/libexec/java_home', '-F', '-v', '25'].execute()
    probe.waitFor()
    probe.exitValue() == 0
}

subprojects {
    plugins.withId('java') {
        if (secureTraversalJdk.get()) {
            tasks.withType(Test).configureEach {
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(25)
                }
            }
        }
    }

    apply plugin: 'idea'
    idea {
        module {
            excludeDirs += [file('build')]
        }
    }

    apply plugin: 'com.diffplug.spotless'

    plugins.withId('java') {
        spotless {
            java {
                // Pinned below 1.35.0: 1.28.0+ references javac-internal classes (e.g.
                // com.sun.tools.javac.tree.JCTree$JCAnyPattern) that are unresolvable via
                // --add-exports on any locally available JDK — verified identical failure on
                // 17/21/25, so this is a broken artifact, not a JDK-version incompatibility.
                // 1.22.0 is the newest release confirmed to run cleanly with no extra JVM args.
                googleJavaFormat('1.22.0').aosp()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }
}