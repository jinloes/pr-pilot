plugins {
    id 'java-library'
    id 'info.solidsoft.pitest'
}

group = 'com.jinloes.prpilot'
version = '1.0.0'

repositories {
    mavenCentral()
}

// core is a plain Java 21 module: all shared models are plain Java so downstream Java modules
// don't need Kotlin-Java interop shims (no jackson-module-kotlin, no @JvmOverloads/@JvmStatic).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
