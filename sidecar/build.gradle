plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.jinloes.prpilot'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':github-engine')
    implementation project(':review-engine')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Stable, predictable jar name so host processes (e.g. the VS Code extension's
// SidecarClient) can locate the build output without globbing a version-suffixed name.
bootJar {
    archiveFileName = 'pr-pilot-sidecar.jar'
    mainClass = 'com.jinloes.prpilot.sidecar.PrPilotSidecarApplication'
}

