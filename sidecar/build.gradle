plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.jinloes.prpilot'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The dependency-management plugin enforces Spring Boot's BOM versions over Gradle's highest-wins
// resolution. Boot 3.5.16 pins Jackson, Log4j API and Commons Lang below their patched releases,
// and below what github-engine and review-engine declare, so raise those BOM properties here.
ext['jackson-bom.version'] = '2.22.3'
ext['log4j2.version'] = '2.25.5'
ext['commons-lang3.version'] = '3.18.0'

dependencies {
    implementation project(':github-engine')
    implementation project(':review-engine')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Stable, predictable jar name so host processes (e.g. the VS Code extension's
// SidecarClient) can locate the build output without globbing a version-suffixed name.
bootJar {
    archiveFileName = 'pr-pilot-sidecar.jar'
    mainClass = 'com.jinloes.prpilot.sidecar.PrPilotSidecarApplication'
}

