plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.jinloes.prpilot'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The dependency-management plugin enforces Spring Boot's BOM versions over Gradle's highest-wins
// resolution. Boot 4.1.2 pins Jackson 2, Commons Lang and JUnit below what the other modules
// declare, so raise those BOM properties to match. In Boot 4 `jackson-bom.version` names the
// Jackson 3 BOM; the Jackson 2 line PR Pilot uses is `jackson-2-bom.version`.
ext['jackson-2-bom.version'] = '2.22.4'
ext['commons-lang3.version'] = '3.21.0'
ext['junit-jupiter.version'] = '6.1.3'

dependencies {
    implementation project(':github-engine')
    implementation project(':review-engine')
    // No spring-boot-starter-json: Boot 4 auto-configures Jackson 3, while every module speaks
    // Jackson 2, so SidecarConfiguration builds the Jackson 2 ObjectMapper itself.
    implementation 'org.springframework.boot:spring-boot-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Stable, predictable jar name so host processes (e.g. the VS Code extension's
// SidecarClient) can locate the build output without globbing a version-suffixed name.
bootJar {
    archiveFileName = 'pr-pilot-sidecar.jar'
    mainClass = 'com.jinloes.prpilot.sidecar.PrPilotSidecarApplication'
}

